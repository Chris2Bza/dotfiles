[env]
TERM = "xterm-256color"

[cursor]
style = "Beam"

[font]
size = 11.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"


[window]
startup_mode = "Windowed"
decorations = "Full"

# Colors (Nord Theme)
# Source https://github.com/nordtheme/alacritty

# Default colors
[colors.primary]
    background     = "#2e3440"
    foreground     = "#d8dee9"
    dim_foreground = "#a5abb6"
[colors.cursor]
    text   = "#2e3440"
    cursor = "#d8dee9"
[colors.vi_mode_cursor]
    text   = "#2e3440"
    cursor = "#d8dee9"
[colors.selection]
    text       = '#a9b1d6'
    background = "#4c566a"
[colors.search]
matches = { foreground = "#1a1b26", background = "#88c0d0" }

[colors.normal]
    black   = "#3b4252"
    red     = "#bf616a"
    green   = "#a3be8c"
    yellow  = "#ebcb8b"
    blue    = "#81a1c1"
    magenta = "#b48ead"
    cyan    = "#88c0d0"
    white   = "#e5e9f0"
[colors.bright]
    black   = "#4c566a"
    red     = "#bf616a"
    green   = "#a3be8c"
    yellow  = "#ebcb8b"
    blue    = "#81a1c1"
    magenta = "#b48ead"
    cyan    = "#8fbcbb"
    white   = "#eceff4"
[colors.dim]
    black   = "#373e4d"
    red     = "#94545d"
    green   = "#809575"
    yellow  = "#b29e75"
    blue    = "#68809a"
    magenta = "#8c738c"
    cyan    = "#6d96a5"
    white   = "#aeb3bb"

